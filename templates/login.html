<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Unbinge</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%233AA6D6%22 stroke-width=%222%22><path d=%22M12 2.5C9 6.5 5.5 10.5 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10.5 15 6.5 12 2.5z%22/></svg>">
    <meta name="theme-color" content="#14161C">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% from "icons.html" import icon %}
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem;">
    <div class="panel" style="max-width:340px; width:100%;">
        <div style="display:flex; align-items:center; gap:9px; margin-bottom:1.2rem;">
            {{ icon('droplet', 22) }}
            <span style="font-size:17px; font-weight:600;">Unbinge</span>
        </div>

        {% if error %}
        <div class="banner banner-error">{{ icon('alert-triangle', 15) }}<span>{{ error }}</span></div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="field">
                <label for="password">password</label>
                <input type="password" id="password" name="password" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:0.5rem;">sign in</button>
        </form>
    </div>
</div>
</body>
</html>
